<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>守護日配對抽籤</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #222; --muted: #6b6b6b;
    --line: #e2ddd3; --accent: #2f6b4f; --accent-soft: #e6f0ea; --hot: #c0392b; --gold: #b8862b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161816; --card: #212421; --text: #ececec; --muted: #a0a0a0;
            --line: #353a35; --accent: #7cc39d; --accent-soft: #24382c; --hot: #ff7a6b; --gold: #e0b35a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         font-size: 17px; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 4px 0 2px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 16px; font-size: 15px; min-height: 1em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  input, button, textarea { font: inherit; color: var(--text); }
  input, textarea { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 170px; }
  label.f { display: block; font-weight: 700; margin: 14px 0 6px; }
  label.f:first-child { margin-top: 0; }
  label.f span { font-weight: 400; color: var(--muted); font-size: 14px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .cols { grid-template-columns: 1fr; } }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 12px;
           padding: 12px 18px; font-weight: 700; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.link { background: none; color: var(--muted); padding: 4px 6px; font-weight: 400; font-size: 15px; text-decoration: underline; }
  button:disabled { opacity: .4; cursor: default; }
  .big { width: 100%; font-size: 21px; padding: 16px; }
  .warn { color: var(--hot); font-size: 15px; margin-top: 10px; }
  .stage, .stage *, .ctrl, .ctrl * { -webkit-user-select: none; user-select: none;
          -webkit-touch-callout: none; touch-action: manipulation; }
  .stage { text-align: center; background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 18px; padding: 20px 12px; margin-bottom: 16px; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
  .cap { font-size: 15px; color: var(--muted); font-weight: 700; }
  .nm { font-size: min(10vw, 60px); font-weight: 800; line-height: 1.25; word-break: break-all; min-height: 1.25em; }
  .nm.idle { opacity: .25; }
  .vol .nm { color: var(--accent); }
  .guest .nm { color: var(--hot); }
  .heart { font-size: min(8vw, 38px); }
  .nm.win { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 2px solid var(--accent); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .tabs button { background: transparent; color: var(--accent); border-radius: 0; padding: 12px 6px; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .hint { text-align: center; font-size: 16px; margin: 0 0 10px; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .names button { font-size: 20px; padding: 14px 8px; }
  .done { text-align: center; color: var(--accent); font-weight: 700; padding: 8px 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rhead b { font-size: 18px; }
  ol.res { margin: 0; padding: 0; list-style: none; }
  ol.res li { display: grid; grid-template-columns: 2em 1fr auto 1fr; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  ol.res li .i { color: var(--muted); }
  ol.res li .v { color: var(--accent); font-weight: 700; }
  ol.res li .g { color: var(--hot); font-weight: 700; text-align: right; }
  .extra { margin-top: 10px; font-size: 15px; }
  .extra div { margin: 2px 0; }
  .center { text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>守護日配對抽籤</h1>
  <p class="sub" id="sub"></p>

  <!-- 第一步：填名單 -->
  <section id="setupView">
    <div class="card">
      <label class="f" for="session">今天場次 <span>（選填）</span></label>
      <input id="session" placeholder="例如：12/10 BNI 守護日">

      <label class="f" for="host">駐場 <span>（不參加抽籤）</span></label>
      <input id="host" placeholder="例如：鄭鴻鈞">

      <div class="cols">
        <div><label class="f" for="vols">志工 <span id="volCount"></span></label>
          <textarea id="vols" placeholder="一行一個名字"></textarea></div>
        <div><label class="f" for="guests">被調整者 <span id="guestCount"></span></label>
          <textarea id="guests" placeholder="一行一個名字"></textarea></div>
      </div>
      <div class="warn" id="countWarn"></div>
    </div>
    <button class="big" id="startBtn">名單好了，開始抽籤</button>
    <p class="muted center">名單只存在這支手機，不會上傳。</p>
  </section>

  <!-- 第二步：抽籤 -->
  <section id="drawView" hidden>
    <div class="stage">
      <div class="pair">
        <div class="vol"><div class="cap">志工</div><div class="nm idle" id="volName">？</div></div>
        <div class="heart">🤝</div>
        <div class="guest"><div class="cap">被調整者</div><div class="nm idle" id="guestName">？</div></div>
      </div>
    </div>

    <div class="ctrl">
      <div class="tabs" id="tabs">
        <button data-mode="self">自己抽</button>
        <button data-mode="host">主持人抽</button>
      </div>

      <div id="selfBox">
        <p class="hint">點你的名字，抽出幫你調整的志工</p>
        <div class="names" id="guestBtns"></div>
      </div>

      <div id="hostBox">
        <div class="row2">
          <button id="allBtn">全部一起抽</button>
          <button class="ghost" id="goBtn">抽一組</button>
        </div>
      </div>

      <div class="done" id="doneMsg" hidden>全部配好了！</div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="rhead"><b>配對結果</b><button class="ghost" id="copyBtn">複製</button></div>
      <ol class="res" id="results"></ol>
      <div class="muted" id="noRes">還沒抽。</div>
      <div class="extra" id="extra"></div>
      <div class="center" style="margin-top:10px">
        <button class="link" id="undoBtn">收回上一組</button>
        <button class="link" id="editBtn">改名單</button>
        <button class="link" id="resetBtn">全部重抽</button>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var KEY = 'wuyi-pair-v1';
  var $ = function (id) { return document.getElementById(id); };
  var st = { session: '', host: '', vols: '', guests: '', pairs: [], mode: 'self', view: 'setup' };
  try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) st = Object.assign(st, s); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function list(t) {
    var seen = {}, out = [];
    String(t || '').split(/\r?\n|,|，|、/).forEach(function (x) {
      x = x.trim(); if (x && !seen[x]) { seen[x] = 1; out.push(x); }
    });
    return out;
  }
  function hosts() { return list(st.host); }
  function volList() { var h = {}; hosts().forEach(function (x) { h[x] = 1; }); return list(st.vols).filter(function (x) { return !h[x]; }); }
  function usedSet(k) { var o = {}; st.pairs.forEach(function (p) { o[p[k]] = 1; }); return o; }
  function remain() {
    var uv = usedSet('v'), ug = usedSet('g');
    return { v: volList().filter(function (x) { return !uv[x]; }),
             g: list(st.guests).filter(function (x) { return !ug[x]; }) };
  }
  function rnd(n) {
    if (window.crypto && crypto.getRandomValues) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    return Math.floor(Math.random() * n);
  }
  var busy = false;

  function renderSetup() {
    var V = volList(), G = list(st.guests);
    $('volCount').textContent = V.length ? '（' + V.length + ' 位）' : '';
    $('guestCount').textContent = G.length ? '（' + G.length + ' 位）' : '';
    var w = '';
    if (V.length && G.length && V.length > G.length) w = '志工多 ' + (V.length - G.length) + ' 位，沒配到的志工協助現場。';
    if (V.length && G.length && V.length < G.length) w = '被調整者多 ' + (G.length - V.length) + ' 位，會有人沒配到，請駐場安排。';
    $('countWarn').textContent = w;
    $('startBtn').disabled = !(V.length && G.length);
  }

  function render() {
    var setup = st.view !== 'draw';
    $('setupView').hidden = !setup;
    $('drawView').hidden = setup;
    var H = hosts();
    $('sub').textContent = [st.session, H.length ? '駐場：' + H.join('、') : ''].filter(Boolean).join('｜');
    renderSetup();
    if (setup) return;

    var r = remain(), can = r.v.length > 0 && r.g.length > 0;
    var mode = st.mode === 'host' ? 'host' : 'self';
    Array.prototype.forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === mode); });
    $('selfBox').hidden = mode !== 'self' || !can;
    $('hostBox').hidden = mode !== 'host' || !can;
    $('doneMsg').hidden = can;

    var gb = $('guestBtns'); gb.innerHTML = '';
    r.g.forEach(function (g) {
      var b = document.createElement('button'); b.textContent = g; b.disabled = busy;
      b.onclick = function () { drawOne(false, render, g); };
      gb.appendChild(b);
    });
    $('goBtn').disabled = busy; $('allBtn').disabled = busy;

    var ol = $('results'); ol.innerHTML = '';
    st.pairs.forEach(function (p, i) {
      var li = document.createElement('li');
      [['i', (i + 1) + '.'], ['v', p.v], ['h', '🤝'], ['g', p.g]].forEach(function (c) {
        var sp = document.createElement('span'); sp.className = c[0]; sp.textContent = c[1]; li.appendChild(sp);
      });
      ol.appendChild(li);
    });
    $('noRes').hidden = !!st.pairs.length;
    var ex = $('extra'); ex.innerHTML = '';
    var lines = [];
    if (!can && r.v.length) lines.push('沒配到的志工（協助現場）：' + r.v.join('、'));
    if (!can && r.g.length) lines.push('還沒配到的被調整者：' + r.g.join('、') + '（請駐場安排）');
    lines.forEach(function (t) { var d = document.createElement('div'); d.textContent = t; ex.appendChild(d); });
    $('undoBtn').hidden = !st.pairs.length;
    $('resetBtn').hidden = !st.pairs.length;
  }

  function clearStage() {
    $('volName').textContent = '？'; $('guestName').textContent = '？';
    $('volName').classList.add('idle'); $('guestName').classList.add('idle');
  }
  function show(v, g, win) {
    var a = $('volName'), b = $('guestName');
    a.textContent = v; b.textContent = g;
    a.classList.remove('idle', 'win'); b.classList.remove('idle', 'win');
    if (win) { void a.offsetWidth; a.classList.add('win'); b.classList.add('win'); }
  }

  function drawOne(fast, done, fixedG) {
    var r = remain(); if (!r.v.length || !r.g.length) { done && done(); return; }
    var v = r.v[rnd(r.v.length)], g = fixedG || r.g[rnd(r.g.length)];
    var finish = function () { st.pairs.push({ v: v, g: g }); save(); show(v, g, true); done && done(); };
    if (fast) { finish(); return; }
    busy = true; render();
    var t = 0, steps = 22;
    (function tick() {
      t++;
      show(r.v[rnd(r.v.length)], fixedG || r.g[rnd(r.g.length)], false);
      if (t < steps) setTimeout(tick, 40 + t * 6);
      else { busy = false; finish(); render(); }
    })();
  }

  $('startBtn').onclick = function () { st.view = 'draw'; save(); render(); window.scrollTo(0, 0); };
  $('editBtn').onclick = function () { st.view = 'setup'; save(); render(); window.scrollTo(0, 0); };
  Array.prototype.forEach.call($('tabs').children, function (b) {
    b.onclick = function () { if (busy) return; st.mode = b.getAttribute('data-mode'); save(); render(); };
  });
  $('goBtn').onclick = function () { drawOne(false, render); };
  $('allBtn').onclick = function () {
    var r = remain(), n = Math.min(r.v.length, r.g.length);
    for (var i = 0; i < n; i++) drawOne(true);
    render();
  };
  function twoTap(btn, label, fn) {
    var armed = false, timer;
    btn.onclick = function () {
      if (!armed) { armed = true; btn.textContent = '再按一次確認'; timer = setTimeout(function () { armed = false; btn.textContent = label; }, 3000); return; }
      clearTimeout(timer); armed = false; btn.textContent = label; fn();
    };
  }
  twoTap($('undoBtn'), '收回上一組', function () {
    st.pairs.pop(); save();
    var p = st.pairs[st.pairs.length - 1];
    if (p) show(p.v, p.g, false); else clearStage();
    render();
  });
  twoTap($('resetBtn'), '全部重抽', function () { st.pairs = []; save(); clearStage(); render(); });
  $('copyBtn').onclick = function () {
    var H = hosts(), r = remain();
    var txt = (st.session ? st.session + ' 配對結果\n' : '配對結果\n') +
      (H.length ? '駐場：' + H.join('、') + '\n' : '') +
      st.pairs.map(function (p, i) { return (i + 1) + '. ' + p.v + ' → ' + p.g; }).join('\n') +
      (r.v.length ? '\n協助現場：' + r.v.join('、') : '') +
      (r.g.length ? '\n還沒配到：' + r.g.join('、') : '');
    var ok = function () { $('copyBtn').textContent = '已複製'; setTimeout(function () { $('copyBtn').textContent = '複製'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function () {});
  };
  ['session', 'host', 'vols', 'guests'].forEach(function (k) {
    $(k).value = st[k];
    $(k).addEventListener('input', function () { st[k] = $(k).value; save(); render(); });
  });
  var last = st.pairs[st.pairs.length - 1];
  if (last) show(last.v, last.g, false);
  render();
})();
</script>
</body>
</html>
