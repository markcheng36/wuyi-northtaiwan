<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>守護日抽籤配對</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #222; --muted: #6b6b6b;
    --line: #e2ddd3; --accent: #2f6b4f; --accent-soft: #e6f0ea; --hot: #c0392b; --gold: #b8862b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161816; --card: #212421; --text: #ececec; --muted: #a0a0a0;
            --line: #353a35; --accent: #7cc39d; --accent-soft: #24382c; --hot: #ff7a6b; --gold: #e0b35a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         font-size: 16px; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  input, button, textarea { font: inherit; color: var(--text); }
  input, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input.wide, textarea { width: 100%; }
  textarea { min-height: 150px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .cols { grid-template-columns: 1fr; } }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
           padding: 10px 16px; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: var(--hot); }
  button:disabled { opacity: .45; cursor: default; }
  /* 抽籤舞台：不可選字、不雙擊放大 */
  .stage, .stage *, .ctrl, .ctrl * { -webkit-user-select: none; user-select: none;
          -webkit-touch-callout: none; touch-action: manipulation; }
  .stage { text-align: center; background: var(--accent-soft); border-color: var(--accent); padding: 22px 12px; }
  .sess { font-size: 15px; color: var(--muted); font-weight: 600; min-height: 22px; }
  .host { font-size: 15px; color: var(--gold); font-weight: 700; min-height: 0; }
  .host:empty { display: none; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 14px 0 4px; }
  .side .cap { font-size: 14px; color: var(--muted); font-weight: 600; }
  .side .nm { font-size: min(10vw, 64px); font-weight: 800; line-height: 1.2; word-break: break-all; min-height: 1.2em; }
  .side .nm.idle { opacity: .3; }
  .side.vol .nm { color: var(--accent); }
  .side.guest .nm { color: var(--hot); }
  .heart { font-size: min(8vw, 40px); color: var(--gold); }
  .nm.win { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .ctrl { text-align: center; }
  .go { font-size: 22px; padding: 14px 40px; }
  .left { margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { font-size: 14px; color: var(--muted); }
  td.n { width: 2.2em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .warn { color: var(--hot); font-size: 14px; }
  body.show .setup { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>守護日抽籤配對</h1>

  <div class="card stage">
    <div class="sess" id="sessLabel"></div>
    <div class="host" id="hostLabel"></div>
    <div class="pair">
      <div class="side vol"><div class="cap">志工夥伴</div><div class="nm idle" id="volName">？</div></div>
      <div class="heart">🤝</div>
      <div class="side guest"><div class="cap">被調整者</div><div class="nm idle" id="guestName">？</div></div>
    </div>
  </div>

  <div class="ctrl">
    <button class="go" id="goBtn">抽一組</button>
    <div class="row" style="justify-content:center">
      <button class="secondary" id="allBtn">剩下的一次抽完</button>
      <button class="secondary" id="undoBtn">取消上一組</button>
    </div>
    <div class="muted left" id="leftInfo"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between">
      <b>配對結果</b>
      <button class="secondary" id="copyBtn">複製結果</button>
    </div>
    <table id="resultTbl" hidden><thead><tr><th></th><th>志工夥伴</th><th>被調整者</th></tr></thead><tbody id="results"></tbody></table>
    <div class="muted" id="noRes">還沒抽。</div>
    <div class="muted" id="unpaired"></div>
    <div class="muted" id="hostInfo"></div>
  </div>

  <div class="card setup">
    <details id="setupBox" open>
      <summary><b>設定（抽之前先確認）</b></summary>
      <div class="row"><label>場次</label>
        <input class="wide" id="session" placeholder="例如 12/10（四）10:00 BNI 守護日"></div>
      <div class="row"><label>駐場</label>
        <input class="wide" id="host" placeholder="顧場的人，不參加抽籤，可以填多位，用逗號隔開">
      </div>
      <div class="cols">
        <div><b>志工夥伴</b> <span class="muted" id="volCount"></span>
          <textarea id="vols" placeholder="一行一個名字"></textarea></div>
        <div><b>被調整者</b> <span class="muted" id="guestCount"></span>
          <textarea id="guests" placeholder="一行一個名字"></textarea></div>
      </div>
      <div class="warn" id="countWarn"></div>
      <p class="muted">從報名系統的名單複製貼上就好，一行一個名字。駐場的人就算也貼在志工名單裡，也會自動排除，不會被抽到。名單只存在這台手機或電腦，不會傳到網路上。人數不一樣時，多出來的志工列為「機動支援」，多出來的被調整者列為「還沒配到」，由駐場安排。</p>
      <div class="row">
        <button class="secondary" id="hideBtn">投影模式（藏起設定）</button>
        <button class="danger" id="resetBtn">清空配對結果</button>
      </div>
    </details>
  </div>
  <p class="muted" style="text-align:center"><a href="#" id="showSetup" hidden>顯示設定</a></p>
</main>
<script>
(function () {
  var KEY = 'wuyi-pair-v1';
  var $ = function (id) { return document.getElementById(id); };
  var st = { session: '', host: '', vols: '', guests: '', pairs: [] };
  try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) st = Object.assign(st, s); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function list(t) {
    var seen = {}, out = [];
    String(t || '').split(/\r?\n|,|，|、/).forEach(function (x) {
      x = x.trim(); if (x && !seen[x]) { seen[x] = 1; out.push(x); }
    });
    return out;
  }
  function hosts() { return list(st.host); }
  function volList() { var h = {}; hosts().forEach(function (x) { h[x] = 1; }); return list(st.vols).filter(function (x) { return !h[x]; }); }
  function usedSet(k) { var o = {}; st.pairs.forEach(function (p) { o[p[k]] = 1; }); return o; }
  function remain() {
    var uv = usedSet('v'), ug = usedSet('g');
    return { v: volList().filter(function (x) { return !uv[x]; }),
             g: list(st.guests).filter(function (x) { return !ug[x]; }) };
  }
  function rnd(n) {
    if (window.crypto && crypto.getRandomValues) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    return Math.floor(Math.random() * n);
  }
  var busy = false;

  function render() {
    $('sessLabel').textContent = st.session;
    var V = volList(), G = list(st.guests), r = remain(), H = hosts();
    $('hostLabel').textContent = H.length ? '駐場：' + H.join('、') : '';
    $('hostInfo').textContent = H.length ? '駐場（顧場，不參加抽籤）：' + H.join('、') : '';
    $('volCount').textContent = V.length + ' 位';
    $('guestCount').textContent = G.length + ' 位';
    $('countWarn').textContent = (V.length && G.length && V.length !== G.length)
      ? (V.length > G.length
        ? '抽籤的志工 ' + V.length + ' 位、被調整者 ' + G.length + ' 位：會有 ' + (V.length - G.length) + ' 位志工當機動支援。'
        : '抽籤的志工 ' + V.length + ' 位、被調整者 ' + G.length + ' 位：會有 ' + (G.length - V.length) + ' 位被調整者配不到，請駐場安排。') : '';
    var can = r.v.length > 0 && r.g.length > 0;
    $('goBtn').disabled = busy || !can;
    $('allBtn').disabled = busy || !can;
    $('undoBtn').disabled = busy || !st.pairs.length;
    $('leftInfo').textContent = (V.length || G.length)
      ? '還可以抽 ' + Math.min(r.v.length, r.g.length) + ' 組' : '先在下方設定填入名單';
    var tb = $('results'); tb.innerHTML = '';
    st.pairs.forEach(function (p, i) {
      var tr = document.createElement('tr');
      [String(i + 1), p.v, p.g].forEach(function (t, j) {
        var td = document.createElement('td'); td.textContent = t; if (j === 0) td.className = 'n'; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    $('resultTbl').hidden = !st.pairs.length;
    $('noRes').hidden = !!st.pairs.length;
    var un = [];
    if (st.pairs.length && !can) {
      if (r.v.length) un.push('機動支援 → ' + r.v.join('、'));
      if (r.g.length) un.push('還沒配到的被調整者 → ' + r.g.join('、'));
    }
    $('unpaired').textContent = un.join('；');
  }

  function show(v, g, win) {
    var a = $('volName'), b = $('guestName');
    a.textContent = v; b.textContent = g;
    a.classList.remove('idle', 'win'); b.classList.remove('idle', 'win');
    if (win) { void a.offsetWidth; a.classList.add('win'); b.classList.add('win'); }
  }

  function drawOne(fast, done) {
    var r = remain(); if (!r.v.length || !r.g.length) { done && done(); return; }
    var v = r.v[rnd(r.v.length)], g = r.g[rnd(r.g.length)];
    var finish = function () { st.pairs.push({ v: v, g: g }); save(); show(v, g, true); done && done(); };
    if (fast) { finish(); return; }
    busy = true; render();
    var t = 0, steps = 22;
    (function tick() {
      t++;
      show(r.v[rnd(r.v.length)], r.g[rnd(r.g.length)], false);
      if (t < steps) setTimeout(tick, 40 + t * 6);
      else { busy = false; finish(); render(); }
    })();
  }

  $('goBtn').onclick = function () { drawOne(false, render); };
  $('allBtn').onclick = function () {
    var r = remain(), n = Math.min(r.v.length, r.g.length);
    for (var i = 0; i < n; i++) drawOne(true);
    render();
  };
  function twoTap(btn, label, fn) {
    var armed = false, timer;
    btn.onclick = function () {
      if (!armed) { armed = true; btn.textContent = '再按一次確認'; timer = setTimeout(function () { armed = false; btn.textContent = label; }, 3000); return; }
      clearTimeout(timer); armed = false; btn.textContent = label; fn();
    };
  }
  twoTap($('undoBtn'), '取消上一組', function () {
    st.pairs.pop(); save();
    var p = st.pairs[st.pairs.length - 1];
    if (p) show(p.v, p.g, false); else { $('volName').textContent = '？'; $('guestName').textContent = '？'; $('volName').classList.add('idle'); $('guestName').classList.add('idle'); }
    render();
  });
  twoTap($('resetBtn'), '清空配對結果', function () {
    st.pairs = []; save();
    $('volName').textContent = '？'; $('guestName').textContent = '？';
    $('volName').classList.add('idle'); $('guestName').classList.add('idle');
    render();
  });
  $('copyBtn').onclick = function () {
    var H = hosts(), r = remain();
    var txt = (st.session ? st.session + ' 配對結果\n' : '配對結果\n') +
      (H.length ? '駐場：' + H.join('、') + '\n' : '') +
      st.pairs.map(function (p, i) { return (i + 1) + '. ' + p.v + ' → ' + p.g; }).join('\n') +
      (r.v.length ? '\n機動支援：' + r.v.join('、') : '') +
      (r.g.length ? '\n還沒配到：' + r.g.join('、') : '');
    var ok = function () { $('copyBtn').textContent = '已複製'; setTimeout(function () { $('copyBtn').textContent = '複製結果'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function () {});
  };
  $('hideBtn').onclick = function () { document.body.classList.add('show'); $('showSetup').hidden = false; };
  $('showSetup').onclick = function (e) { e.preventDefault(); document.body.classList.remove('show'); $('showSetup').hidden = true; };
  ['session', 'host', 'vols', 'guests'].forEach(function (k) {
    $(k).value = st[k];
    $(k).addEventListener('input', function () { st[k] = $(k).value; save(); render(); });
  });
  var last = st.pairs[st.pairs.length - 1];
  if (last) show(last.v, last.g, false);
  render();
})();
</script>
</body>
</html>
