<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>專講抽獎</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #222; --muted: #6b6b6b;
    --line: #e2ddd3; --accent: #2f6b4f; --accent-soft: #e6f0ea; --hot: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161816; --card: #212421; --text: #ececec; --muted: #a0a0a0;
            --line: #353a35; --accent: #7cc39d; --accent-soft: #24382c; --hot: #ff7a6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         font-size: 16px; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  input, button, select { font: inherit; color: var(--text); }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 160px; }
  input { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type=number] { width: 90px; text-align: right; }
  input.wide, textarea.wide { width: 100%; }
  textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
             border-radius: 8px; padding: 6px 8px; min-height: 96px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .row label { min-width: 72px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
           padding: 10px 16px; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: var(--hot); }
  button:disabled { opacity: .45; cursor: default; }
  .stage { text-align: center; background: var(--accent-soft); border-color: var(--accent); padding: 24px 16px; }
  .sess { font-size: 15px; color: var(--muted); font-weight: 600; min-height: 22px; }
  .prize-cap { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .prize { font-size: min(9vw, 44px); font-weight: 800; color: var(--accent); line-height: 1.25;
           display: inline-block; margin-top: 4px; padding: 6px 22px; border: 2px solid var(--accent);
           border-radius: 999px; background: var(--card); word-break: break-all; }
  .prize:empty, .prize-cap:empty { display: none; }
  .num { font-size: min(30vw, 200px); font-weight: 800; letter-spacing: 2px; line-height: 1.1;
         font-variant-numeric: tabular-nums; margin: 8px 0; }
  .num.name { font-size: min(16vw, 120px); letter-spacing: 0; word-break: break-all; }
  .num.win { color: var(--hot); animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .go { font-size: 22px; padding: 14px 40px; }
  .left { margin-top: 8px; }
  ol { margin: 0; padding-left: 22px; }
  li { margin: 2px 0; }
  li b { font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; font-weight: 600; }
  body.show .setup { display: none; }
  [hidden] { display: none !important; }
  input[type=file] { max-width: 100%; }
  .mode label { min-width: 0; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>專講抽獎</h1>

  <div class="card stage">
    <div class="sess" id="sessLabel"></div>
    <div class="prize-cap" id="prizeCap"></div>
    <div><div class="prize" id="prizeLabel"></div></div>
    <div class="num" id="num">----</div>
    <button class="go" id="goBtn">抽一個</button>
    <div class="muted left" id="leftInfo"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>中獎名單</b>
      <button class="secondary" id="undoBtn">取消上一個</button>
    </div>
    <ol id="winners"></ol>
    <div class="muted" id="noWin">還沒抽。</div>
  </div>

  <div class="card setup">
    <details id="setupBox" open>
      <summary>設定（抽之前先確認）</summary>
      <div class="row"><label>場次</label>
        <select id="session"></select>
        <span class="muted">試算表的場次＋今天的日期，臨時加開就選今天</span></div>
      <p class="muted" id="sheetStatus">讀取試算表中…</p>
      <div class="row mode"><label>抽獎方式</label>
        <label><input type="radio" name="mode" value="ticket"> 對號（照試算表）</label>
        <label><input type="radio" name="mode" value="name"> 對名字（上傳名單）</label></div>
      <div class="byname">
        <div class="row"><label>上傳名單</label><input type="file" id="nameFile" accept=".txt,.csv,text/plain,text/csv">
          <span class="muted">純文字檔，一行一個名字</span></div>
        <div class="row"><label>名單</label>
          <textarea class="wide" id="names" placeholder="上傳後會出現在這裡，也可以直接貼上或修改，一行一個名字"></textarea></div>
        <p class="muted">名單只存在這台手機或電腦，不會傳到網路上。</p>
      </div>
      <div class="row ticket"><label>券號從</label><input type="number" id="from" min="1" value="1">
        <span>到</span><input type="number" id="to" min="1" value="30"></div>
      <div class="row ticket"><label>不抽這些</label>
        <input class="wide" id="skip" placeholder="沒發出去的號碼，例如 5, 12, 20-25"></div>
      <div class="row"><label>獎項</label>
        <input class="wide" id="prizes" placeholder="用逗號隔開，例如 足弓墊, 免費調整一次"></div>
      <p class="muted">兩種設定方式都可以：先在 Google 試算表「專講抽獎名單」填好每一場，這裡會自動帶入；來不及的話，直接改上面的欄位就好，改過的會記在這台手機上。每個場次的中獎名單分開記，同一個號碼或名字不會被抽到兩次。</p>
      <div class="row">
        <button class="secondary" id="reloadBtn">重新讀取試算表</button>
        <button class="secondary" id="hideBtn">投影模式（藏起設定）</button>
        <button class="danger" id="resetBtn">清空這場中獎名單</button>
      </div>
    </details>
  </div>
  <p class="muted" style="text-align:center"><a href="#" id="showSetup" hidden>顯示設定</a></p>
</main>

<script>
// 試算表「專講抽獎名單」（Drive Claude產出\BNI），共用設定要是「知道連結的任何人：檢視者」
const SHEET_ID = '1LqtbRljg33-HiJFFbfieXjbNKS0g_uopELeXGkXqlcA';
const KEY = 'chun-draw-v2';
const $ = id => document.getElementById(id);

let store = { current: '', sessions: {} };
try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let sheet = {};           // 場次 -> 設定（從試算表讀到的）
const blank = () => ({ mode: 'ticket', from: 1, to: 30, skip: '', prizes: '', names: '', winners: [], edited: false });
const normKey = k => { k = String(k || '').trim().replace(/\D/g, ''); return k.length === 3 ? '0' + k : k; };
const today = () => { const d = new Date(); return String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); };

function sess() {
  const k = store.current;
  if (!store.sessions[k]) store.sessions[k] = Object.assign(blank(), sheet[k] || {});
  return store.sessions[k];
}
function applySheet(force) {
  Object.keys(sheet).forEach(k => {
    const s = store.sessions[k];
    if (!s) return;
    if (force ? k === store.current : !s.edited) Object.assign(s, sheet[k], { edited: false });
  });
}

const pad = n => String(n).padStart(Math.max(4, String(sess().to).length), '0');

function parseSkip(text) {
  const set = new Set();
  String(text).replace(/[，、]/g, ',').split(/[,\s]+/).forEach(p => {
    const m = p.match(/^(\d+)(?:[-~－～](\d+))?$/);
    if (!m) return;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) set.add(i);
  });
  return set;
}
function prizeList() {
  return String(sess().prizes).split(/[\n,，、]+/).map(s => s.trim()).filter(Boolean);
}
// 對名字：抽名單上的人（同名的人各算一次），沒名單就抽券號
function nameList() {
  return String(sess().names || '').split(/\r?\n/).map(s => s.replace(/^\uFEFF/, '').split(',')[0].trim()).filter(Boolean);
}
const byName = () => sess().mode === 'name';
const show = v => typeof v === 'number' ? pad(v) : v;
function pool() {
  const s = sess();
  if (byName()) {
    const left = nameList();
    s.winners.forEach(w => { const i = left.indexOf(w.n); if (i >= 0) left.splice(i, 1); });
    return left;
  }
  const skip = parseSkip(s.skip);
  const won = new Set(s.winners.map(w => w.n));
  const out = [];
  for (let i = +s.from; i <= +s.to; i++) if (!skip.has(i) && !won.has(i)) out.push(i);
  return out;
}
function nextPrize() {
  const list = prizeList();
  const i = sess().winners.length;
  if (!list.length) return '第 ' + (i + 1) + ' 位';
  return i < list.length ? list[i] : '加碼';
}
function randInt(n) {
  const a = new Uint32Array(1);
  const lim = Math.floor(0x100000000 / n) * n;
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}

const esc = v => String(v).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
let rolling = false, justWon = null;
function render() {
  const s = sess();
  $('from').value = s.from; $('to').value = s.to;
  $('skip').value = s.skip; $('prizes').value = s.prizes;
  if (document.activeElement !== $('names')) $('names').value = s.names || '';
  document.querySelectorAll('.ticket').forEach(el => el.hidden = byName());
  document.querySelectorAll('.byname').forEach(el => el.hidden = !byName());
  document.querySelectorAll('input[name=mode]').forEach(el => el.checked = el.value === (s.mode || 'ticket'));
  $('num').classList.toggle('name', byName());
  const p = pool();
  $('sessLabel').textContent = store.current ? store.current.slice(0, 2) + '/' + store.current.slice(2) + ' 場' : '';
  // 剛抽完先顯示這個號碼抽中的獎項，再按「抽一個」才換成下一個獎項
  $('prizeCap').textContent = justWon ? '抽中' : p.length ? '這次抽' : '';
  $('prizeLabel').textContent = justWon ? justWon.prize : p.length ? nextPrize() : '';
  $('leftInfo').textContent = '還有 ' + p.length + (byName() ? ' 個人' : ' 個號碼') + '可以抽';
  $('goBtn').disabled = !p.length || rolling;
  $('winners').innerHTML = s.winners.map(w =>
    '<li><b>' + esc(typeof w.n === 'number' ? 'No.' + pad(w.n) : w.n) + '</b>　' + esc(w.prize) + '</li>').join('');
  $('noWin').hidden = s.winners.length > 0;
  $('undoBtn').hidden = !s.winners.length;
  // 下拉選單：今天＋試算表的每個場次（N+1）；目前選的場次不在裡面也會保留
  const t = today();
  const keys = [t, ...[...new Set([...Object.keys(sheet), store.current])].filter(k => k && k !== t).sort()];
  const md = k => k.slice(0, 2) + '/' + k.slice(2);
  $('session').innerHTML = keys.map(k => '<option value="' + k + '">' + md(k) +
    (k === t ? '（今天）' : sheet[k] ? '' : '（手動）') + '</option>').join('');
  $('session').value = store.current;
}

$('goBtn').onclick = () => {
  const p = pool();
  if (!p.length || rolling) return;
  rolling = true; justWon = null; render();
  const el = $('num'); el.classList.remove('win');
  const pick = p[randInt(p.length)];
  const prize = nextPrize();
  const s = sess();
  let t = 0, delay = 40;
  (function spin() {
    el.textContent = show(p[randInt(p.length)]);
    t += delay;
    if (t < 2600) { delay = t > 1600 ? delay * 1.18 : delay; setTimeout(spin, delay); return; }
    el.textContent = show(pick);
    void el.offsetWidth; el.classList.add('win');
    s.winners.push({ n: pick, prize }); justWon = { prize };
    save(); rolling = false; render();
  })();
};

['from', 'to', 'skip', 'prizes'].forEach(id => $(id).addEventListener('input', () => {
  const s = sess();
  s[id] = (id === 'from' || id === 'to') ? (+$(id).value || 1) : $(id).value;
  s.edited = true;
  save(); render();
}));
// 名單不算「改過設定」，試算表的券號設定照樣會更新
$('names').addEventListener('input', () => { sess().names = $('names').value; save(); render(); });
document.querySelectorAll('input[name=mode]').forEach(el => el.addEventListener('change', () => {
  const s = sess();
  if (s.winners.length) { $('sheetStatus').textContent = '這場已經抽過了，換方式前請先「清空這場中獎名單」。'; render(); return; }
  s.mode = el.value; justWon = null; $('num').textContent = byName() ? '?' : '----'; $('num').classList.remove('win');
  save(); render();
}));
$('nameFile').addEventListener('change', async () => {
  const f = $('nameFile').files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')) { try { text = new TextDecoder('big5').decode(buf); } catch (e) {} }
  const s = sess(); s.names = text.replace(/^\uFEFF/, ''); save();
  $('names').value = s.names; $('nameFile').value = ''; render();
});
$('session').addEventListener('change', () => {
  const k = $('session').value;
  if (!k) return;
  store.current = k; justWon = null; $('num').textContent = byName() ? '?' : '----'; $('num').classList.remove('win');
  save(); render();
});

// 按兩次才執行（Apps Script 等環境會擋 confirm()）
function twoTap(btn, label, action) {
  let armed = null;
  btn.onclick = () => {
    if (armed) { clearTimeout(armed); armed = null; btn.textContent = label; action(); return; }
    btn.textContent = '再按一次確定';
    armed = setTimeout(() => { armed = null; btn.textContent = label; }, 3000);
  };
}
twoTap($('resetBtn'), '清空這場中獎名單', () => { sess().winners = []; justWon = null; $('num').textContent = '----';
  $('num').classList.remove('win'); save(); render(); });
twoTap($('undoBtn'), '取消上一個', () => { sess().winners.pop(); justWon = null;
  $('num').textContent = byName() ? '?' : '----'; $('num').classList.remove('win'); save(); render(); });
twoTap($('reloadBtn'), '重新讀取試算表', () => loadSheet(true));

$('hideBtn').onclick = () => { document.body.classList.add('show'); $('showSetup').hidden = false; };
$('showSetup').onclick = e => { e.preventDefault(); document.body.classList.remove('show'); $('showSetup').hidden = true; };

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function loadSheet(force) {
  $('sheetStatus').textContent = '讀取試算表中…';
  try {
    const res = await fetch('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&t=' + Date.now());
    const text = await res.text();
    if (!res.ok || /^\s*</.test(text)) throw new Error('not csv');
    sheet = {};
    parseCSV(text).slice(1).forEach(r => {
      const k = normKey(r[0]);
      if (!k) return;
      sheet[k] = { from: +r[1] || 1, to: +r[2] || 1, skip: (r[3] || '').trim(), prizes: (r[4] || '').trim() };
    });
    applySheet(force);
    $('sheetStatus').textContent = '已從試算表讀到 ' + Object.keys(sheet).length + ' 個場次。';
  } catch (e) {
    $('sheetStatus').textContent = '讀不到試算表，請直接在下面設定（或檢查試算表是否開了「知道連結的任何人可檢視」）。';
  }
  if (!store.current) store.current = today();
  save(); render();
}

if (!store.current || !store.sessions[store.current] || !store.sessions[store.current].winners.length) store.current = today();
render();
loadSheet(false);
</script>
</body>
</html>
