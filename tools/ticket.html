<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專講抽獎券</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --text:#222; --muted:#6b6b6b; --line:#e2ddd3; --accent:#2f6b4f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.5; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 4px; }
  .muted { color:var(--muted); font-size:14px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  label { display:block; font-size:14px; font-weight:600; margin-bottom:4px; }
  input { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text); }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:10px; border:1px solid var(--accent); cursor:pointer; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:#fff; color:var(--accent); }
  .preview { overflow:hidden; }
  .preview-inner { transform-origin:top left; }

  /* ---- 抽獎券本體：190 × 84 mm，A4 直式一頁 3 張 ---- */
  .t { --olive:#6B7355; --olive-dark:#4F5740; --coral:#C1553D; --coral-dark:#9E4330; --ink:#3A362F; --ink-soft:#6B6558; --cream:#F3F2EE;
       position:relative; width:190mm; height:84mm; display:flex; overflow:hidden; color:var(--ink);
       background:linear-gradient(160deg,#EDE7D9 0%,var(--cream) 50%,#E7DFCE 100%);
       font-family:"Noto Serif TC",serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .t::before { content:""; position:absolute; width:62mm; height:62mm; border-radius:50%; background:#A89078; opacity:.18; top:-26mm; right:44mm; }
  .t-main { position:relative; flex:1; padding:6mm 7mm 5mm 8mm; display:flex; flex-direction:column; }
  .t-top { display:flex; align-items:center; justify-content:space-between; }
  .t-top img { height:13mm; }
  .t-tag { font-size:3.4mm; font-weight:700; letter-spacing:.6mm; color:var(--coral); border:.3mm solid var(--coral);
           padding:.6mm 3mm; border-radius:99mm; background:rgba(255,255,255,.55); }
  .t-title { margin-top:1.5mm; font-size:11mm; font-weight:900; letter-spacing:1mm; line-height:1.1; }
  .t-sess { margin-top:1mm; font-size:4.2mm; font-weight:700; letter-spacing:.5mm; color:var(--olive-dark); }
  .t-num { margin-top:auto; display:flex; align-items:baseline; gap:2.5mm; }
  .t-num .k { font-size:7mm; font-weight:900; color:var(--coral-dark); }
  .t-num .v { font-size:25mm; font-weight:900; line-height:.9; color:var(--coral); font-variant-numeric:tabular-nums; letter-spacing:-.2mm; }
  .t-how { margin-top:2mm; padding-top:1.6mm; border-top:.25mm solid rgba(58,54,47,.18); font-size:3.3mm; color:var(--ink-soft); letter-spacing:.3mm; }
  .t-stub { position:relative; width:52mm; background:var(--olive); color:#F3F2EE; padding:5mm 4mm 4mm;
            display:flex; flex-direction:column; align-items:center; text-align:center;
            border-left:.5mm dashed rgba(255,255,255,.55); }
  .t-stub .k { font-size:3.4mm; letter-spacing:1mm; opacity:.9; }
  .t-stub .big { font-size:5.2mm; font-weight:900; letter-spacing:.6mm; margin-top:.5mm; }
  .t-stub .qr { margin-top:2.5mm; background:#fff; border-radius:2.5mm; padding:1.5mm; }
  .t-stub .qr img { display:block; width:24mm; height:24mm; }
  .t-stub .cta { margin-top:2.5mm; font-size:3.6mm; font-weight:700; line-height:1.45; letter-spacing:.3mm; }
  .t-stub .cta b { color:#fff; font-size:4.4mm; }
  .t-stub .no { margin-top:auto; font-family:"Noto Sans TC",sans-serif; font-size:3.2mm; font-weight:700; letter-spacing:.5mm; opacity:.85; }

  #sheet { display:none; }
  @media print {
    @page { size:A4 portrait; margin:10mm; }
    body { background:#fff; }
    main { display:none; }
    #sheet { display:block; }
    #sheet .t { margin:0 auto 6mm; outline:.3mm dashed #999; break-inside:avoid; page-break-inside:avoid; }
    #sheet .t:nth-child(3n) { break-after:page; page-break-after:always; margin-bottom:0; }
  }
</style>
</head>
<body>
<main>
  <h1>專講抽獎券</h1>
  <div class="muted">每張印自己的號碼，A4 一頁 3 張，印好沿虛線剪開發給大家。號碼跟抽獎頁的同一場次對得上。</div>

  <div class="panel">
    <div class="grid">
      <div><label for="in-brand">品牌</label>
        <select id="in-brand" style="width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff">
          <option value="chun">鈞衡舍</option>
          <option value="strx">結構X獵人</option>
        </select></div>
      <div><label for="in-sess">場次（日期，例如 1021）</label><input id="in-sess" inputmode="numeric" maxlength="4"></div>
      <div><label for="in-from">號碼從</label><input id="in-from" type="number" min="1" value="1"></div>
      <div><label for="in-to">號碼到</label><input id="in-to" type="number" min="1" value="30"></div>
      <div><label for="in-title">券標題</label><input id="in-title" value="專講抽獎券"></div>
      <div><label for="in-tag">右上角標籤（可留空）</label><input id="in-tag" value="BNI 專講"></div>
      <div><label for="in-how">下方說明</label><input id="in-how" value="請保留本券，抽獎時對號領獎"></div>
    </div>
    <div class="btns">
      <button class="primary" id="printBtn" type="button">🖨 列印 A4（一頁 3 張）</button>
      <span class="muted" id="status"></span>
    </div>
  </div>

  <div class="muted" style="margin-bottom:6px">預覽（第一張）</div>
  <div class="preview" id="preview"><div class="preview-inner" id="previewInner"></div></div>
</main>

<div id="sheet"></div>

<script>
// 號碼範圍跟抽獎頁 draw.html 一樣，從試算表「專講抽獎名單」帶入（場次｜券號從｜券號到）
const SHEET_ID = '1LqtbRljg33-HiJFFbfieXjbNKS0g_uopELeXGkXqlcA';
const KEY = 'chun-ticket-v1';
const $ = id => document.getElementById(id);
// 兩個品牌：LOGO、官方 LINE QR、LINE 名稱
const BRANDS = {
  chun: { logo: 'coupon-chunbalance-logo.png',      qr: 'coupon-chunbalance-qr.png', line: '鈞衡舍' },
  strx: { logo: 'coupon-strxhunter-logo.png', qr: 'coupon-strxhunter-qr.png', line: '結構X獵人' }
};
const FIELDS = ['in-brand', 'in-sess', 'in-from', 'in-to', 'in-title', 'in-tag', 'in-how'];
const normKey = k => { k = String(k || '').trim().replace(/\D/g, ''); return k.length === 3 ? '0' + k : k; };
const today = () => { const d = new Date(); return String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); };
let sheet = {};

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  ['in-brand', 'in-title', 'in-tag', 'in-how'].forEach(id => { if (saved[id] != null) $(id).value = saved[id]; });
} catch (e) {}
$('in-sess').value = today();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ 'in-brand': $('in-brand').value, 'in-title': $('in-title').value, 'in-tag': $('in-tag').value, 'in-how': $('in-how').value })); } catch (e) {}
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function sessLabel(k) {
  const m = /^(\d{2})(\d{2})$/.exec(k);
  return m ? `${+m[1]}/${+m[2]} 場次` : '';
}
function ticket(n) {
  const k = normKey($('in-sess').value);
  const to = +$('in-to').value || 1;
  const no = String(n).padStart(Math.max(4, String(to).length), '0');
  const tag = $('in-tag').value.trim();
  const b = BRANDS[$('in-brand').value] || BRANDS.chun;
  return `<div class="t">
    <div class="t-main">
      <div class="t-top"><img src="${b.logo}" alt="${b.line}">${tag ? `<span class="t-tag">${esc(tag)}</span>` : ''}</div>
      <div class="t-title">${esc($('in-title').value)}</div>
      <div class="t-sess">${esc(sessLabel(k))}</div>
      <div class="t-num"><span class="k">No.</span><span class="v">${no}</span></div>
      <div class="t-how">${esc($('in-how').value)}</div>
    </div>
    <div class="t-stub">
      <div class="k">加碼抽獎</div>
      <div class="big">再抽一次</div>
      <div class="qr"><img src="${b.qr}" alt="${b.line} LINE"></div>
      <div class="cta">加官方 LINE<br>「${b.line}」<br>傳 <b>抽獎 ${esc(k)}</b></div>
      <div class="no">No.${no}</div>
    </div>
  </div>`;
}

function render() {
  $('previewInner').innerHTML = ticket(+$('in-from').value || 1);
  const t = $('previewInner').firstElementChild;
  const k = Math.min(1, $('preview').clientWidth / t.offsetWidth);
  $('previewInner').style.transform = `scale(${k})`;
  $('preview').style.height = (t.offsetHeight * k) + 'px';
}

function fillFromSheet() {
  const s = sheet[normKey($('in-sess').value)];
  if (s) { $('in-from').value = s.from; $('in-to').value = s.to; $('status').textContent = '已從試算表帶入這場的號碼範圍。'; }
}

FIELDS.forEach(id => $(id).addEventListener('input', () => { if (id === 'in-sess') fillFromSheet(); save(); render(); }));
window.addEventListener('resize', render);

$('printBtn').addEventListener('click', () => {
  const from = Math.max(1, +$('in-from').value || 1);
  const to = Math.max(from, +$('in-to').value || from);
  if (to - from + 1 > 300) { $('status').textContent = '一次最多印 300 張，請分批。'; return; }
  let html = '';
  for (let n = from; n <= to; n++) html += ticket(n);
  $('sheet').innerHTML = html;
  $('status').textContent = `準備列印 ${to - from + 1} 張（${Math.ceil((to - from + 1) / 3)} 頁）`;
  setTimeout(() => window.print(), 300);   // 等圖片排好再叫出列印
});

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

(async function loadSheet() {
  try {
    const res = await fetch('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&t=' + Date.now());
    const text = await res.text();
    if (!res.ok || /^\s*</.test(text)) throw new Error('not csv');
    parseCSV(text).slice(1).forEach(r => {
      const k = normKey(r[0]);
      if (k) sheet[k] = { from: +r[1] || 1, to: +r[2] || 1 };
    });
    // 今天不是場次的話，先帶最近一場還沒到的場次（券通常是提前印）
    if (!sheet[normKey($('in-sess').value)]) {
      const next = Object.keys(sheet).filter(k => k >= today()).sort()[0];
      if (next) $('in-sess').value = next;
    }
    fillFromSheet();
  } catch (e) {
    $('status').textContent = '讀不到試算表，號碼範圍請直接填。';
  }
  render();
})();

render();
if (document.fonts) document.fonts.ready.then(render);
</script>
</body>
</html>
